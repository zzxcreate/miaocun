name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不再使用 android-actions/setup-android：runner 自带 Android SDK，
      # 那个 action 内部的 sdkmanager 在部分镜像上会直接 exit 1。
      # 这里只补一份许可证文件，缺的 platform / build-tools 由 AGP 自己下载。
      - name: Prepare Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "using SDK: $SDK"
          mkdir -p "$SDK/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"
          echo "android.sdk.licenses done"
          ls -1 "$SDK" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 固定签名证书：runner 自带的 debug.keystore 每次都不同，签名一变
      # 手机上就无法覆盖安装（提示"应用未安装"）。这里用仓库里固定的一份；
      # 首次运行时自动生成，生成后提交回仓库即可长期复用。
      - name: Ensure fixed debug keystore
        run: |
          if [ ! -f app/miaocun-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/miaocun-debug.keystore -storetype PKCS12 \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l app/miaocun-debug.keystore

      - name: Assemble debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miaocun-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 仅在证书还没提交进仓库时有用：把它下载下来提交一次即可。
      - name: Upload debug keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: app/miaocun-debug.keystore
          if-no-files-found: warn
